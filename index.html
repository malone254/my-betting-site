<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aviator Pro</title>

<script src="/socket.io/socket.io.js"></script>

<style>
body {
  margin: 0;
  font-family: system-ui, Arial;
  background: radial-gradient(circle at top, #0f172a, #050814);
  color: white;
  overflow-x: hidden;
}

/* TOP BAR */
.top {
  display: flex;
  justify-content: space-between;
  padding: 15px;
  background: rgba(255,255,255,0.05);
}

/* GAME AREA */
.game {
  height: 55vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  position: relative;
}

/* MULTIPLIER */
#multiplier {
  font-size: 70px;
  font-weight: bold;
  color: #00ff99;
  text-shadow: 0 0 20px rgba(0,255,153,0.5);
}

/* STATUS */
#status {
  margin-top: 10px;
  color: #aaa;
}

/* PLANE (simple animation feel) */
.plane {
  width: 120px;
  position: absolute;
  bottom: 20px;
  transition: transform 0.1s linear;
}

/* PANEL */
.panel {
  background: rgba(255,255,255,0.05);
  padding: 20px;
  border-radius: 15px;
  margin: 10px;
}

input {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: none;
  margin-bottom: 10px;
  font-size: 16px;
  text-align: center;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 8px;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
}

.bet { background: #2563eb; color: white; }
.cashout { background: #16a34a; color: white; }
.disabled { opacity: 0.5; cursor: not-allowed; }

/* HISTORY */
.history {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: center;
  padding: 10px;
}

.badge {
  background: #1f2937;
  padding: 5px 10px;
  border-radius: 6px;
  font-size: 12px;
}
</style>
</head>

<body>

<div class="top">
  <div>🚀 Aviator Pro</div>
  <div id="wallet">Balance: 1000</div>
</div>

<div class="game">
  <div id="multiplier">1.00x</div>
  <div id="status">Waiting for round...</div>

  <img class="plane" id="plane"
  src="https://cdn-icons-png.flaticon.com/512/2933/2933790.png">
</div>

<div class="panel">
  <input type="number" id="bet" placeholder="Enter bet">

  <button class="bet" onclick="placeBet()">Place Bet</button>
  <button class="cashout" onclick="cashout()">Cashout</button>
</div>

<div class="history" id="history"></div>

<script>
const socket = io();

let multiplier = 1;
let bet = 0;
let betPlaced = false;
let wallet = 1000;

/* LIVE MULTIPLIER */
socket.on("multiplier", (m) => {
  multiplier = m;
  document.getElementById("multiplier").innerText = m.toFixed(2) + "x";
  document.getElementById("status").innerText = "Flying... 🚀";

  /* plane movement effect */
  let plane = document.getElementById("plane");
  plane.style.transform = `translateY(-${m * 10}px)`;
});

/* CRASH */
socket.on("crash", (point) => {
  document.getElementById("status").innerText = "💥 CRASHED at " + point + "x";
  betPlaced = false;
});

/* HISTORY */
socket.on("history", (data) => {
  let html = "";
  data.forEach(x => {
    html += `<div class="badge">${x}x</div>`;
  });
  document.getElementById("history").innerHTML = html;
});

/* BET */
function placeBet() {
  bet = Number(document.getElementById("bet").value);

  if (bet <= 0) return alert("Enter bet");

  if (bet > wallet) return alert("Not enough balance");

  wallet -= bet;
  document.getElementById("wallet").innerText = "Balance: " + wallet;

  betPlaced = true;
  alert("Bet placed: " + bet);
}

/* CASHOUT */
function cashout() {
  if (!betPlaced) return alert("No active bet");

  socket.emit("cashout", { bet });

  socket.on("cashout_success", (data) => {
    wallet += data.payout;
    document.getElementById("wallet").innerText = "Balance: " + wallet;

    alert(`Cashed out at ${data.multiplier}x\nWon: ${data.payout}`);

    betPlaced = false;
  });
}
</script>

</body>
</html>
