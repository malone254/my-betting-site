<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MaloneBet</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
}

/* TOP BAR */
.topbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px;
background:#111a2e;
border-bottom:1px solid #1f2a44;
position:sticky;
top:0;
}

.logo{
color:#00ff9d;
font-size:20px;
font-weight:bold;
}

/* NAV BUTTONS */
.navbar{
display:flex;
gap:10px;
overflow-x:auto;
padding:10px;
background:#0f1728;
border-bottom:1px solid #1f2a44;
}

.navbtn{
background:#1f2a44;
padding:8px 12px;
border-radius:20px;
color:white;
text-decoration:none;
font-size:13px;
white-space:nowrap;
}

.navbtn:hover{
background:#00ff9d;
color:black;
}

/* SECTIONS */
h2{
padding:10px 15px;
color:#00ff9d;
font-size:18px;
}

.card{
background:#121a2f;
margin:10px 15px;
padding:15px;
border-radius:12px;
border:1px solid #1f2a44;
}

.match{
font-size:17px;
font-weight:bold;
}

.date{
font-size:12px;
opacity:0.7;
margin-bottom:10px;
}

/* ODDS */
.odds button{
margin:5px 5px 0 0;
padding:8px 10px;
border:none;
border-radius:6px;
background:#1f2a44;
color:white;
font-size:13px;
cursor:pointer;
}

.odds button:hover{
background:#00ff9d;
color:black;
}

/* BOTTOM NAV (APP STYLE) */
.bottomnav{
position:fixed;
bottom:0;
left:0;
right:0;
display:flex;
justify-content:space-around;
background:#111a2e;
padding:10px 0;
border-top:1px solid #1f2a44;
}

.bottomnav a{
color:white;
text-decoration:none;
font-size:12px;
opacity:0.8;
text-align:center;
}

.bottomnav a:hover{
color:#00ff9d;
}
</style>

</head>

<body>

<div class="topbar">
<div class="logo">MaloneBet</div>
<div>⚽ Sportsbook</div>
</div>

<!-- NAV BUTTONS -->
<div class="navbar">
<a class="navbtn" href="/">Home</a>
<a class="navbtn" href="/live">Live</a>
<a class="navbtn" href="/login">Login</a>
<a class="navbtn" href="/register">Register</a>
<a class="navbtn" href="#">More</a>
</div>

<h2>⚽ Today & Upcoming Games</h2>
<div id="matches"></div>

<!-- BOTTOM NAV -->
<div class="bottomnav">
<a href="/">🏠<br>Home</a>
<a href="/live">🔴<br>Live</a>
<a href="/login">🔐<br>Login</a>
<a href="/register">👤<br>Register</a>
</div>

<script>

async function load(){

const res = await fetch('/api/matches');
const data = await res.json();

const box = document.getElementById("matches");
box.innerHTML = "";

data.forEach(m => {

const div = document.createElement("div");
div.className = "card";

div.innerHTML = `
<div class="match">${m.home_team} vs ${m.away_team}</div>
<div class="date">${new Date(m.commence_time).toLocaleString()}</div>

<div class="odds">
<button>1</button>
<button>X</button>
<button>2</button>
<button>O2.5</button>
<button>U2.5</button>
</div>
`;

box.appendChild(div);

});

}

load();

</script>

</body>
</html>
