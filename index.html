<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MaloneBet</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
}

/* TOP BAR */
.topbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px;
background:#111a2e;
border-bottom:1px solid #1f2a44;
position:sticky;
top:0;
}

.logo{
color:#00ff9d;
font-weight:bold;
font-size:20px;
}

/* LEAGUE TABS */
.tabs{
display:flex;
overflow-x:auto;
background:#0f1728;
padding:10px;
gap:10px;
border-bottom:1px solid #1f2a44;
}

.tab{
flex:0 0 auto;
padding:8px 14px;
border-radius:20px;
background:#121a2f;
border:1px solid #1f2a44;
cursor:pointer;
font-size:14px;
white-space:nowrap;
}

.tab.active{
background:#00ff9d;
color:black;
font-weight:bold;
}

/* CONTENT */
.container{
padding:15px;
padding-bottom:80px;
}

.card{
background:#121a2f;
padding:15px;
margin-bottom:10px;
border-radius:12px;
border:1px solid #1f2a44;
}

.team{
font-size:18px;
font-weight:bold;
}

.time{
font-size:13px;
opacity:0.7;
margin-top:5px;
}

.btn{
display:block;
margin-top:10px;
padding:10px;
background:#00ff9d;
color:black;
text-align:center;
text-decoration:none;
border-radius:10px;
font-weight:bold;
}

/* BOTTOM NAV */
.bottomnav{
position:fixed;
bottom:0;
left:0;
right:0;
display:flex;
justify-content:space-around;
background:#111a2e;
padding:10px 0;
border-top:1px solid #1f2a44;
}

.bottomnav a{
color:white;
text-decoration:none;
font-size:13px;
opacity:0.8;
}
</style>

</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
<div class="logo">MaloneBet</div>
<div>⚽ Upcoming</div>
</div>

<!-- LEAGUE TABS -->
<div class="tabs">
<div class="tab active" onclick="filterLeague('all')">All</div>
<div class="tab" onclick="filterLeague('soccer_epl')">EPL</div>
<div class="tab" onclick="filterLeague('soccer_spain_la_liga')">La Liga</div>
<div class="tab" onclick="filterLeague('soccer_germany_bundesliga')">Bundesliga</div>
<div class="tab" onclick="filterLeague('soccer_italy_serie_a')">Serie A</div>
<div class="tab" onclick="filterLeague('soccer_france_ligue_one')">Ligue 1</div>
</div>

<!-- CONTENT -->
<div class="container">

<h2>⚽ Upcoming Matches</h2>

<div id="matches">Loading matches...</div>

</div>

<!-- BOTTOM NAV -->
<div class="bottomnav">
<a href="/">🏠 Home</a>
<a href="/live">⚽ Live</a>
<a href="/login">🔐 Login</a>
<a href="/register">👤 Register</a>
</div>

<script>

let allMatches = [];
let currentLeague = "all";

/* LOAD MATCHES */
async function loadMatches(){

const res = await fetch('/api/matches');
const data = await res.json();

allMatches = data;
render();

}

/* FILTER LEAGUE */
function filterLeague(league){

currentLeague = league;

document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
event.target.classList.add("active");

render();

}

/* RENDER MATCHES */
function render(){

const box = document.getElementById("matches");
box.innerHTML = "";

let filtered = allMatches;

if(currentLeague !== "all"){
filtered = allMatches.filter(m => m.sport_key === currentLeague);
}

if(filtered.length === 0){
box.innerHTML = "<p>No matches found</p>";
return;
}

filtered.forEach(m => {

const div = document.createElement("div");
div.className = "card";

div.innerHTML = `
<div class="team">${m.home_team} vs ${m.away_team}</div>
<div class="time">${new Date(m.commence_time).toLocaleString()}</div>
<a class="btn" href="/live">View Odds</a>
`;

box.appendChild(div);

});

}

loadMatches();

</script>

</body>
</html>
