<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MaloneBet</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
}

/* TOP BAR */
.topbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px;
background:#111a2e;
border-bottom:1px solid #1f2a44;
position:sticky;
top:0;
}

.logo{
color:#00ff9d;
font-weight:bold;
font-size:20px;
}

/* HERO */
.hero{
padding:20px;
text-align:center;
}

.hero h1{
font-size:26px;
margin:10px 0;
}

.sub{
opacity:0.7;
font-size:14px;
}

/* MATCH LIST */
.container{
padding:15px;
padding-bottom:80px;
}

.card{
background:#121a2f;
padding:15px;
margin-bottom:10px;
border-radius:12px;
border:1px solid #1f2a44;
}

.team{
font-size:18px;
font-weight:bold;
}

.league{
font-size:12px;
opacity:0.7;
margin-top:4px;
}

.time{
font-size:13px;
opacity:0.7;
margin-top:5px;
}

.btn{
display:block;
margin-top:10px;
padding:10px;
background:#00ff9d;
color:black;
text-align:center;
text-decoration:none;
border-radius:10px;
font-weight:bold;
}

/* BOTTOM NAV */
.bottomnav{
position:fixed;
bottom:0;
left:0;
right:0;
display:flex;
justify-content:space-around;
background:#111a2e;
padding:10px 0;
border-top:1px solid #1f2a44;
}

.bottomnav a{
color:white;
text-decoration:none;
font-size:13px;
opacity:0.8;
}
</style>

</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
<div class="logo">⚽ MaloneBet</div>
<div>Upcoming</div>
</div>

<!-- HERO -->
<div class="hero">
<h1>Big 5 Upcoming Matches</h1>
<p class="sub">EPL • La Liga • Bundesliga • Serie A • Ligue 1</p>
</div>

<!-- MATCHES -->
<div class="container">
<div id="matches">Loading matches...</div>
</div>

<!-- BOTTOM NAV -->
<div class="bottomnav">
<a href="/">🏠 Home</a>
<a href="/live">⚽ Live</a>
<a href="/login">🔐 Login</a>
<a href="/register">👤 Register</a>
</div>

<script>

async function loadMatches(){

const res = await fetch('/api/matches');
const data = await res.json();

const box = document.getElementById("matches");
box.innerHTML = "";

if(!data || data.length === 0){
box.innerHTML = "<p>No upcoming matches found</p>";
return;
}

data.forEach(m => {

const div = document.createElement("div");
div.className = "card";

let league = m.sport_key.replace("soccer_","").toUpperCase();

div.innerHTML = `
<div class="team">${m.home_team} vs ${m.away_team}</div>
<div class="league">${league}</div>
<div class="time">${new Date(m.commence_time).toLocaleString()}</div>
<a class="btn" href="/live">View Odds</a>
`;

box.appendChild(div);

});

}

loadMatches();

</script>

</body>
</html>
