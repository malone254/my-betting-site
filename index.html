<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MaloneBet</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
}

/* TOP BAR */
.topbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px;
background:#111a2e;
position:sticky;
top:0;
border-bottom:1px solid #1f2a44;
}

.logo{
color:#00ff9d;
font-weight:bold;
font-size:20px;
}

/* CONTENT */
.container{
padding:15px;
padding-bottom:80px;
}

h1{
font-size:26px;
margin:10px 0;
}

.sub{
opacity:0.7;
font-size:14px;
}

/* MATCH CARD */
.card{
background:#121a2f;
padding:15px;
margin-bottom:12px;
border-radius:14px;
border:1px solid #1f2a44;
}

.team{
font-size:18px;
font-weight:bold;
margin-bottom:5px;
}

.time{
font-size:13px;
opacity:0.7;
}

/* BUTTON */
.btn{
display:block;
text-align:center;
margin-top:10px;
padding:12px;
background:#00ff9d;
color:black;
text-decoration:none;
border-radius:10px;
font-weight:bold;
font-size:15px;
}

/* BOTTOM NAV (APP STYLE) */
.bottomnav{
position:fixed;
bottom:0;
left:0;
right:0;
display:flex;
justify-content:space-around;
background:#111a2e;
padding:10px 0;
border-top:1px solid #1f2a44;
}

.bottomnav a{
color:white;
text-decoration:none;
font-size:13px;
text-align:center;
opacity:0.8;
}

.bottomnav a:hover{
color:#00ff9d;
opacity:1;
}

/* LOADING */
.loading{
opacity:0.7;
font-size:14px;
}
</style>

</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
<div class="logo">MaloneBet</div>
<div>⚽ Live</div>
</div>

<!-- MAIN -->
<div class="container">

<h1>Today's Matches</h1>
<p class="sub">Tap a game to start betting</p>

<div id="matches" class="loading">Loading live games...</div>

</div>

<!-- BOTTOM NAV -->
<div class="bottomnav">
<a href="/">🏠<br>Home</a>
<a href="/live">⚽<br>Live</a>
<a href="/login">🔐<br>Login</a>
<a href="/register">👤<br>Register</a>
</div>

<script>

async function loadMatches(){

try{

const res = await fetch('/api/matches');
const data = await res.json();

const box = document.getElementById("matches");
box.innerHTML = "";

if(!data || data.length === 0){
box.innerHTML = "No matches available";
return;
}

data.forEach(m => {

const div = document.createElement("div");
div.className = "card";

div.innerHTML = `
<div class="team">${m.home_team} vs ${m.away_team}</div>
<div class="time">${new Date(m.commence_time).toLocaleString()}</div>

<a class="btn" href="/live">Bet Now</a>
`;

box.appendChild(div);

});

}catch(err){
document.getElementById("matches").innerHTML = "Failed to load games";
}

}

loadMatches();

</script>

</body>
</html>
