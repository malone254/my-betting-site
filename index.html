<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aviator Game</title>

<script src="/socket.io/socket.io.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b1220;
  color: white;
  text-align: center;
}

/* HEADER */
.header {
  padding: 15px;
  font-size: 20px;
  font-weight: bold;
  background: #111a2e;
}

/* MULTIPLIER */
.multiplier {
  font-size: 60px;
  margin-top: 40px;
  font-weight: bold;
  color: #00ff88;
}

/* STATUS */
.status {
  margin-top: 10px;
  font-size: 16px;
  color: #aaa;
}

/* PANEL */
.panel {
  margin-top: 30px;
  padding: 20px;
}

/* INPUT */
input {
  width: 80%;
  padding: 12px;
  font-size: 18px;
  border-radius: 10px;
  border: none;
  outline: none;
  text-align: center;
}

/* BUTTONS */
button {
  width: 85%;
  padding: 15px;
  margin-top: 10px;
  font-size: 18px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

.bet {
  background: #1f6fff;
  color: white;
}

.cashout {
  background: #00c853;
  color: white;
}

/* HISTORY */
.history {
  margin-top: 25px;
  padding: 10px;
}

.badge {
  display: inline-block;
  background: #1f2a44;
  padding: 5px 10px;
  margin: 3px;
  border-radius: 5px;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="header">🚀 AVIATOR GAME</div>

<div class="multiplier" id="multiplier">1.00x</div>
<div class="status" id="status">Waiting for round...</div>

<div class="panel">
  <input type="number" id="bet" placeholder="Enter Bet Amount">

  <button class="bet" onclick="placeBet()">Place Bet</button>
  <button class="cashout" onclick="cashout()">Cashout</button>
</div>

<div class="history">
  <h3>History</h3>
  <div id="history"></div>
</div>

<script>
const socket = io();

let currentMultiplier = 1;
let betPlaced = false;

/* LIVE MULTIPLIER */
socket.on("multiplier", (data) => {
  currentMultiplier = data;
  document.getElementById("multiplier").innerText = data.toFixed(2) + "x";
  document.getElementById("status").innerText = "Flying...";
});

/* CRASH */
socket.on("crash", (point) => {
  document.getElementById("status").innerText = "CRASHED at " + point + "x";
  betPlaced = false;
});

/* HISTORY */
socket.on("history", (data) => {
  let html = "";
  data.forEach(h => {
    html += `<span class="badge">${h}x</span>`;
  });
  document.getElementById("history").innerHTML = html;
});

/* PLACE BET */
function placeBet() {
  const bet = document.getElementById("bet").value;
  if (!bet) return alert("Enter bet amount");

  betPlaced = true;
  alert("Bet placed: " + bet);
}

/* CASHOUT */
function cashout() {
  const bet = document.getElementById("bet").value;

  if (!betPlaced) {
    alert("Place bet first");
    return;
  }

  socket.emit("cashout", { bet: Number(bet) });

  socket.on("cashout_success", (data) => {
    alert("Cashed out at " + data.multiplier + "x\nWon: " + data.payout);
    betPlaced = false;
  });
}
</script>

</body>
</html>
