<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casino Platform</title>
<script src="/socket.io/socket.io.js"></script>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0b1220;
  color:white;
}

.header {
  padding:15px;
  background:#111a2e;
  display:flex;
  justify-content:space-between;
}

.game {
  text-align:center;
  padding:40px;
}

#multiplier {
  font-size:70px;
  color:#00ff99;
}

.panel {
  padding:20px;
}

input {
  width:100%;
  padding:12px;
  margin-bottom:10px;
}

button {
  width:100%;
  padding:12px;
  margin-top:5px;
}

.bet { background:#2563eb; color:white; }
.cashout { background:#16a34a; color:white; }
</style>
</head>

<body>

<div class="header">
  <div>🎰 Casino</div>
  <div id="balance">Balance: 1000</div>
</div>

<div class="game">
  <div id="multiplier">1.00x</div>
  <div id="status">Waiting...</div>
</div>

<div class="panel">
  <input id="bet" placeholder="Enter bet">

  <button class="bet" onclick="bet()">Place Bet</button>
  <button class="cashout" onclick="cashout()">Cashout</button>
</div>

<script>
const socket = io();

let userId = "demo"; // replace after login
let betPlaced = false;

/* GAME */
socket.on("multiplier", m => {
  document.getElementById("multiplier").innerText = m + "x";
});

/* BET */
function bet() {
  let amount = document.getElementById("bet").value;

  socket.emit("place_bet", {
    userId,
    amount: Number(amount)
  });

  betPlaced = true;
}

/* CASHOUT */
function cashout() {
  socket.emit("cashout", { userId });
}
</script>

</body>
</html>
