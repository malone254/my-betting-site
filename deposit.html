<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deposit</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

<style>

body{
background:#081120;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Poppins;
}

.box{
background:#111c31;
padding:40px;
border-radius:20px;
width:350px;
}

h2{color:#00ff9d;margin-bottom:20px;}

input{
width:100%;
padding:14px;
margin:10px 0;
border:none;
border-radius:10px;
background:#1a2742;
color:white;
}

button{
width:100%;
padding:14px;
background:#00ff9d;
border:none;
border-radius:10px;
font-weight:700;
cursor:pointer;
}

</style>
</head>

<body>

<div class="box">
<h2>Deposit Money</h2>

<input type="text" placeholder="Phone Number">
<input type="number" placeholder="Amount">

<button>Deposit via M-Pesa</button>
</div>

</body>
</html>
