<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

<style>

*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins;}

body{background:#081120;color:white;}

nav{
padding:20px 5%;
display:flex;
justify-content:space-between;
background:#0d1728;
}

.logo{color:#00ff9d;font-size:24px;font-weight:700;}

.container{
padding:30px 5%;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:#111c31;
padding:25px;
border-radius:18px;
text-align:center;
}

.card h2{color:#00ff9d;margin-bottom:10px;}

.card h1{font-size:30px;}

</style>
</head>

<body>

<nav>
<div class="logo">MaloneBet</div>
</nav>

<div class="container">

<div class="card">
<h2>Wallet</h2>
<h1>KSh 5,200</h1>
</div>

<div class="card">
<h2>Total Bets</h2>
<h1>48</h1>
</div>

<div class="card">
<h2>Wins</h2>
<h1>31</h1>
</div>

<div class="card">
<h2>Losses</h2>
<h1>17</h1>
</div>

</div>

</body>
</html>
