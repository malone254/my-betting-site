ui<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - MaloneBet</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif;}

body{
background:#081120;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:#111c31;
padding:40px;
border-radius:20px;
width:350px;
}

h2{
color:#00ff9d;
margin-bottom:20px;
}

input{
width:100%;
padding:14px;
margin:10px 0;
border:none;
border-radius:10px;
background:#1a2742;
color:white;
}

button{
width:100%;
padding:14px;
border:none;
background:#00ff9d;
color:#081120;
font-weight:700;
border-radius:10px;
cursor:pointer;
margin-top:10px;
}

p{
color:#cfd6e4;
text-align:center;
margin-top:15px;
font-size:14px;
}

a{color:#00ff9d;text-decoration:none;}

</style>
</head>

<body>

<div class="box">
<h2>Login</h2>

<input type="email" placeholder="Email">
<input type="password" placeholder="Password">

<button>Login</button>

<p>Don't have account? <a href="/register">Register</a></p>
</div>

</body>
</html>
