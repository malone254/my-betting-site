<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Betting - MaloneBet</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
}

/* TOP BAR */
.topbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px;
background:#111a2e;
border-bottom:1px solid #1f2a44;
position:sticky;
top:0;
}

.logo{
color:#00ff9d;
font-weight:bold;
font-size:20px;
}

.live-dot{
color:red;
font-weight:bold;
}

/* MAIN LAYOUT */
.wrapper{
display:flex;
}

/* MATCH LIST */
.matches{
flex:3;
padding:15px;
}

.card{
background:#121a2f;
padding:15px;
margin-bottom:12px;
border-radius:12px;
border:1px solid #1f2a44;
}

.team{
font-size:18px;
font-weight:bold;
}

.time{
font-size:13px;
opacity:0.7;
margin-bottom:10px;
}

/* MARKET SECTION */
.market-title{
margin-top:10px;
font-size:14px;
opacity:0.8;
}

.odds button{
margin:5px 5px 0 0;
padding:10px 12px;
border:none;
border-radius:8px;
cursor:pointer;
background:#1f2a44;
color:white;
font-size:14px;
}

.odds button:hover{
background:#00ff9d;
color:black;
}

/* BET SLIP */
.slip{
width:320px;
background:#0f1728;
border-left:1px solid #1f2a44;
height:100vh;
position:sticky;
top:0;
padding:15px;
overflow-y:auto;
}

.slip h2{
color:#00ff9d;
}

.bet-item{
background:#121a2f;
padding:10px;
margin-bottom:10px;
border-radius:10px;
font-size:14px;
border:1px solid #1f2a44;
}

input{
width:100%;
padding:10px;
border-radius:8px;
border:none;
margin-top:10px;
}

.place-btn{
width:100%;
margin-top:10px;
padding:12px;
background:#00ff9d;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
}

/* MOBILE */
@media(max-width:900px){
.wrapper{
flex-direction:column;
}

.slip{
width:100%;
height:auto;
position:relative;
border-left:none;
border-top:1px solid #1f2a44;
}
}
</style>

</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
<div class="logo">⚽ Live Bets</div>
<div class="live-dot">🔴 LIVE</div>
</div>

<div class="wrapper">

<!-- MATCHES -->
<div class="matches">

<h2>Live Matches</h2>

<div id="matches">Loading live games...</div>

</div>

<!-- BET SLIP -->
<div class="slip">

<h2>Bet Slip</h2>

<div id="slip"></div>

<input id="stake" placeholder="Enter stake">

<p id="total">Potential Win: 0</p>

<button class="place-btn" onclick="placeBet()">Place Bet</button>

</div>

</div>

<script>

let bets = [];

/* LOAD MATCHES */
async function loadMatches(){

const res = await fetch('/api/matches');
const data = await res.json();

const box = document.getElementById("matches");
box.innerHTML = "";

if(!data || data.length === 0){
box.innerHTML = "<p>No live matches at the moment 🔕</p>";
return;
}

data.forEach(m => {

const div = document.createElement("div");
div.className = "card";

/* BASIC 1X2 + O/U (from API if available) */
div.innerHTML = `
<div class="team">${m.home_team} vs ${m.away_team}</div>
<div class="time">${new Date(m.commence_time).toLocaleString()}</div>

<div class="market-title">1X2</div>
<div class="odds">
<button onclick="addBet('${m.home_team} Win',1.8)">Home</button>
<button onclick="addBet('Draw',2.0)">Draw</button>
<button onclick="addBet('${m.away_team} Win',2.5)">Away</button>
</div>

<div class="market-title">Over/Under 2.5</div>
<div class="odds">
<button onclick="addBet('Over 2.5',1.9)">Over</button>
<button onclick="addBet('Under 2.5',1.8)">Under</button>
</div>
`;

box.appendChild(div);

});

}

/* ADD BET */
function addBet(name,odd){

bets.push({name,odd});
renderSlip();

}

/* RENDER SLIP */
function renderSlip(){

const slip = document.getElementById("slip");
slip.innerHTML = "";

let totalOdds = 1;

bets.forEach(b=>{
totalOdds *= b.odd;

slip.innerHTML += `
<div class="bet-item">
${b.name}<br>
Odds: ${b.odd}
</div>
`;

});

let stake = document.getElementById("stake").value || 0;
document.getElementById("total").innerText =
"Potential Win: " + (stake * totalOdds).toFixed(2);

}

/* PLACE BET */
async function placeBet(){

await fetch('/api/bet',{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
bets,
stake:document.getElementById("stake").value
})
});

alert("Bet placed!");

bets = [];
renderSlip();

}

document.getElementById("stake").addEventListener("input",renderSlip);

loadMatches();

</script>

</body>
  </html>
